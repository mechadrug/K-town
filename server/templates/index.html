<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>K-town 小镇模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#1a1a2e;color:#eee;padding:20px}
h1{text-align:center;color:#e94560;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1200px;margin:0 auto}
.card{background:#16213e;border-radius:12px;padding:20px;box-shadow:0 4px 6px rgba(0,0,0,0.3)}
.card h2{color:#0f3460;margin-bottom:10px;font-size:16px}
.full{grid-column:1/-1}
.map{position:relative;width:100%;height:300px;background:#0f3460;border-radius:8px;overflow:hidden}
.location{position:absolute;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:bold;color:white;text-align:center;transform:translate(-50%,-50%)}
.loc-square{left:50%;top:50%;background:#e94560}
.loc-workshop{left:25%;top:30%;background:#0f4c75}
.loc-wilderness{left:75%;top:70%;background:#2d6a4f}
.agent-dot{position:absolute;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:white;font-weight:bold;transition:all 0.5s ease;border:2px solid white}
.agent-dot:hover{transform:scale(1.3);z-index:10}
.agent-elder{background:#9b59b6}
.agent-blacksmith{background:#e67e22}
.agent-carpenter{background:#d35400}
.agent-forager{background:#27ae60}
.agent-scout{background:#2ecc71}
.agent-merchant{background:#f1c40f;color:#333}
.agent-teacher{background:#3498db}
.agent-farmer{background:#1abc9c}
.agent-storyteller{background:#e91e63}
.agent-player{background:#fff;color:#333;border:3px solid #e94560}
.event-list{max-height:200px;overflow-y:auto;font-size:13px}
.event-list div{padding:4px 0;border-bottom:1px solid #1a1a2e}
.agent-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.agent-info{background:#1a1a2e;padding:8px;border-radius:6px;font-size:12px}
.agent-info .name{font-weight:bold;color:#e94560}
.agent-info .stat{color:#aaa}
.log-entry{font-size:12px;padding:3px 0;border-bottom:1px solid #1a1a2e;color:#aaa}
.day-card{background:#1a1a2e;padding:10px;margin-bottom:8px;border-radius:6px;border-left:3px solid #e94560}
.day-card h3{color:#e94560;font-size:14px}
.day-card .agents{font-size:11px;color:#aaa}
.status-bar{text-align:center;padding:10px;background:#0f3460;border-radius:8px;margin-bottom:20px}
.status-bar span{margin:0 15px}
.status-bar .tick{color:#e94560;font-weight:bold}
.status-bar .weather{color:#3498db}
.status-bar .knowledge{color:#2ecc71}
#ws-status{position:fixed;top:10px;right:10px;padding:6px 12px;border-radius:20px;font-size:12px;background:#e94560}
#ws-status.connected{background:#2ecc71}
</style>
</head>
<body>
<h1>K-town 小镇模拟器</h1>
<div id="ws-status">连接中...</div>

<div class="status-bar">
  <span>Tick: <b class="tick" id="tick">0</b></span>
  <span>天气: <b class="weather" id="weather">-</b></span>
  <span>知识: <b class="knowledge" id="knowledge">0</b> 条</span>
  <span>天数: <b id="day">1</b></span>
</div>

<div class="grid">
  <div class="card">
    <h2>小镇地图</h2>
    <div class="map" id="map">
      <div class="location loc-square">广场</div>
      <div class="location loc-workshop">工坊</div>
      <div class="location loc-wilderness">荒野</div>
    </div>
  </div>

  <div class="card">
    <h2>Agent 状态</h2>
    <div class="agent-list" id="agent-list"></div>
  </div>

  <div class="card full">
    <h2>每日行为日志</h2>
    <div class="event-list" id="event-list"></div>
  </div>

  <div class="card full">
    <h2>每日摘要</h2>
    <div id="day-summaries"></div>
  </div>
</div>

<script>
let ws;
let currentState={};
let daySummaries=[];
let maxLog=50;
let logEntries=[];

function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onopen=()=>{document.getElementById('ws-status').textContent='已连接';document.getElementById('ws-status').classList.add('connected')};
  ws.onclose=()=>{document.getElementById('ws-status').textContent='已断开';document.getElementById('ws-status').classList.remove('connected');setTimeout(connect,2000)};
  ws.onmessage=(e)=>{
    let msg=JSON.parse(e.data);
    if(msg.type==='state'){updateState(msg.data);render()}
    if(msg.type==='day_summary'){daySummaries.push(msg.data);render()}
    if(msg.type==='event'){addEvent(msg.data);render()}
  }
}

function updateState(data){
  currentState=data;
  document.getElementById('tick').textContent=data.tick;
  document.getElementById('weather').textContent=data.weather;
  document.getElementById('day').textContent=Math.floor(data.tick/24)+1;
  let kc=data.knowledge?.total_claims||0;
  document.getElementById('knowledge').textContent=kc;
}

function addEvent(evt){
  logEntries.unshift(evt);
  if(logEntries.length>maxLog)logEntries.pop();
}

function render(){
  if(!currentState.agents)return;
  renderMap();
  renderAgents();
  renderEvents();
  renderDaySummaries();
}

function renderMap(){
  const map=document.getElementById('map');
  map.querySelectorAll('.agent-dot').forEach(e=>e.remove());
  const colors={agent_elder:'agent-elder',agent_blacksmith:'agent-blacksmith',agent_carpenter:'agent-carpenter',agent_forager:'agent-forager',agent_scout:'agent-scout',agent_merchant:'agent-merchant',agent_teacher:'agent-teacher',agent_farmer:'agent-farmer',agent_storyteller:'agent-storyteller',agent_player:'agent-player'};
  const locPos={square:{x:50,y:50},workshop:{x:25,y:30},wilderness:{x:75,y:70}};
  
  currentState.agents.forEach((a,i)=>{
    const dot=document.createElement('div');
    dot.className='agent-dot '+(colors[a.id]||'');
    const pos=locPos[a.location]||{x:50,y:50};
    const offset=((i%4)*12)-(18);
    dot.style.left=`${pos.x+offset}%`;
    dot.style.top=`${pos.y+Math.floor(i/4)*10}%`;
    dot.textContent=a.name.split(' ')[0];
    dot.title=`${a.name}\n体力:${a.energy} 心情:${a.mood}\n位置:${a.location}\n金币:${a.gold}`;
    map.appendChild(dot);
  });
}

function renderAgents(){
  const list=document.getElementById('agent-list');
  list.innerHTML=currentState.agents.map(a=>`<div class="agent-info"><div class="name">${a.name}</div><div class="stat">体力:${a.energy} | ${a.mood}</div><div class="stat">位置:${a.location} | 金币:${a.gold}</div></div>`).join('');
}

function renderEvents(){
  const list=document.getElementById('event-list');
  list.innerHTML=logEntries.map(e=>`<div class="log-entry">[Tick ${e.tick||e.day||''}] ${e.action||e.type||JSON.stringify(e)}</div>`).join('');
}

function renderDaySummaries(){
  const div=document.getElementById('day-summaries');
  div.innerHTML=daySummaries.map(d=>`<div class="day-card"><h3>第 ${d.day} 天 - 天气:${d.weather} | 知识:${d.knowledge_claims}条 | 事件:${d.events_count}次</h3><div class="agents">${d.agents.map(a=>`${a.name}(${a.mood},${a.energy},${a.location})`).join(' | ')}</div></div>`).join('');
}

connect();
setInterval(()=>{
  fetch('/api/state').then(r=>r.json()).then(d=>{updateState(d);render()});
},3000);
</script>
</body>
</html>
