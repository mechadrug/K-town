<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-town 小镇模拟器 v0.2</title>
<style>
:root {
  --bg-primary: #0a0a14;
  --bg-secondary: #121220;
  --bg-card: #181828;
  --bg-hover: #20203a;
  --accent: #ff3366;
  --accent-light: #ff6699;
  --gold: #ffd700;
  --green: #00ff88;
  --blue: #00bfff;
  --purple: #aa88ff;
  --orange: #ff8800;
  --text: #e0e0ff;
  --text-dim: #8080a0;
  --border: rgba(255,255,255,0.06);
  --shadow: 0 12px 40px rgba(0,0,0,0.5);
  --radius: 18px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, var(--bg-primary) 0%, #141430 100%);
  color: var(--text);
  min-height: 100vh;
  padding: 28px;
}

/* 头部 */
.header {
  text-align: center;
  margin-bottom: 36px;
  position: relative;
}
.header h1 {
  font-size: 2.5em;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 3px;
  margin-bottom: 8px;
}
.header .subtitle {
  color: var(--text-dim);
  font-size: 1em;
  margin-top: 4px;
}

/* 状态栏 */
.status-bar {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.status-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 24px;
  background: var(--bg-card);
  border-radius: 50px;
  border: 1px solid var(--border);
  font-size: 0.95em;
  box-shadow: var(--shadow);
}
.status-pill .icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.status-pill .icon.tick { background: rgba(255,51,102,0.2); color: var(--accent); }
.status-pill .icon.weather { background: rgba(0,191,255,0.2); color: var(--blue); }
.status-pill .icon.knowledge { background: rgba(0,255,136,0.2); color: var(--green); }
.status-pill .icon.day { background: rgba(255,215,0,0.2); color: var(--gold); }
.status-pill b { font-size: 1.2em; margin-left: 4px; }

/* 主网格 */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  max-width: 1400px;
  margin: 0 auto;
}
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 28px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.6);
}
.card h2 {
  font-size: 1.1em;
  font-weight: 600;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
}
.card h2 .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
}
.card.full { grid-column: 1 / -1; }

/* 地图 */
.map-container {
  position: relative;
  width: 100%;
  height: 420px;
  background: linear-gradient(135deg, #080810 0%, #101028 100%);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  overflow: hidden;
}
.map-container::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(0,191,255,0.04) 0%, transparent 70%);
}
.location-zone {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 8px 18px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
  border: 1.5px dashed rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.03);
  pointer-events: none;
}
.loc-square { left: 50%; top: 50%; }
.loc-workshop { left: 22%; top: 28%; }
.loc-wilderness { left: 78%; top: 72%; }
.loc-school { left: 22%; top: 72%; }
.loc-mine { left: 78%; top: 28%; }

/* Agent标记 */
.agent-marker {
  position: absolute;
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  color: white;
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  border: 2.5px solid rgba(255,255,255,0.3);
  box-shadow: 0 3px 12px rgba(0,0,0,0.4);
  transform: translate(-50%, -50%);
}
.agent-marker:hover {
  transform: translate(-50%, -50%) scale(1.5);
  z-index: 100;
  box-shadow: 0 6px 24px rgba(0,0,0,0.6);
}

.elder { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
.blacksmith { background: linear-gradient(135deg, #e67e22, #d35400); }
.carpenter { background: linear-gradient(135deg, #a0522d, #8b4513); }
.forager { background: linear-gradient(135deg, #27ae60, #1e8449); }
.scout { background: linear-gradient(135deg, #2ecc71, #27ae60); }
.merchant { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #333; }
.teacher { background: linear-gradient(135deg, #3498db, #2980b9); }
.farmer { background: linear-gradient(135deg, #1abc9c, #16a085); }
.storyteller { background: linear-gradient(135deg, #e91e63, #c2185b); }
.healer { background: linear-gradient(135deg, #00b894, #00cec9); }
.miner { background: linear-gradient(135deg, #636e72, #2d3436); }
.player { background: linear-gradient(135deg, #ffffff, #f0f0f0); color: #333; border: 3px solid var(--accent); }

/* Agent卡片 */
.agent-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  max-height: 420px;
  overflow-y: auto;
}
.agent-card {
  background: var(--bg-hover);
  border-radius: var(--radius-sm);
  padding: 14px;
  border: 1px solid var(--border);
  transition: all 0.3s ease;
}
.agent-card:hover {
  border-color: var(--accent);
  background: rgba(255,51,102,0.08);
}
.agent-card .name {
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.agent-card .role-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.agent-card .stats {
  display: flex;
  gap: 8px;
  font-size: 0.85em;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.agent-card .stats span {
  color: var(--text-dim);
}
.agent-card .energy-bar {
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
}
.agent-card .energy-bar .fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.5s ease;
}
.energy-high { background: linear-gradient(90deg, var(--green), #00cc6a); }
.energy-mid { background: linear-gradient(90deg, var(--gold), #ccac00); }
.energy-low { background: linear-gradient(90deg, var(--accent), #cc2952); }

/* 日志容器 */
.log-container {
  max-height: 200px;
  overflow-y: auto;
  padding-right: 8px;
}
.log-entry {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.9em;
}
.log-entry:last-child { border-bottom: none; }
.log-entry .tick {
  color: var(--accent);
  font-weight: 600;
  margin-right: 8px;
  font-size: 0.85em;
}

/* 每日摘要 */
.day-card {
  background: var(--bg-hover);
  border-radius: var(--radius-sm);
  padding: 20px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
}
.day-card h3 {
  font-size: 1.2em;
  margin-bottom: 12px;
  color: var(--gold);
}
.day-card .overall-summary {
  line-height: 1.6;
  margin-bottom: 16px;
  color: var(--text);
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.day-card .stats-row {
  display: flex;
  gap: 18px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.day-card .stats-row span {
  font-size: 0.9em;
  color: var(--text-dim);
}
.day-card .agent-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}
.day-card .agent-item {
  background: var(--bg-secondary);
  border-radius: 8px;
  padding: 12px;
  font-size: 0.9em;
  line-height: 1.5;
}
.day-card .agent-item b {
  color: var(--accent-light);
  display: block;
  margin-bottom: 4px;
}

/* 回放控制 */
.replay-controls {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.replay-controls input {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text);
  font-size: 0.9em;
}
.replay-controls button {
  padding: 8px 18px;
  border-radius: var(--radius-sm);
  border: none;
  background: var(--accent);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s ease;
}
.replay-controls button:hover {
  background: var(--accent-light);
}
.replay-controls button:disabled {
  background: var(--text-dim);
  cursor: not-allowed;
}

/* 滚动条 */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: var(--bg-secondary);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb {
  background: var(--accent);
  border-radius: 3px;
}

/* 响应式 */
@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
  .agent-grid { grid-template-columns: 1fr; }
  .status-bar { gap: 12px; }
  .status-pill { padding: 8px 16px; font-size: 0.85em; }
}
</style>
</head>
<body>
<div class="header">
  <h1>K-town 小镇模拟器</h1>
  <div class="subtitle">多智能体生活模拟 · 实时更新 · v0.2</div>
  <div class="subtitle" id="ws-status" style="color: var(--green); margin-top: 8px;">连接中...</div>
</div>

<div class="status-bar">
  <div class="status-pill">
    <div class="icon tick">⏱️</div>
    <span>Tick: <b id="tick">0</b></span>
  </div>
  <div class="status-pill">
    <div class="icon weather">🌤️</div>
    <span>天气: <b id="weather">-</b></span>
  </div>
  <div class="status-pill">
    <div class="icon day">📅</div>
    <span>第 <b id="day">1</b> 天</span>
  </div>
  <div class="status-pill">
    <div class="icon knowledge">📚</div>
    <span>知识: <b id="knowledge">0</b> 条</span>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2><span class="dot"></span>小镇地图</h2>
    <div class="map-container" id="map">
      <div class="location-zone loc-square">🏘️ 广场</div>
      <div class="location-zone loc-workshop">🔨 工坊</div>
      <div class="location-zone loc-wilderness">🌿 荒野</div>
      <div class="location-zone loc-school">🏫 学校</div>
      <div class="location-zone loc-mine">⛏️ 矿洞</div>
    </div>
  </div>

  <div class="card">
    <h2><span class="dot"></span>居民状态</h2>
    <div class="agent-grid" id="agent-grid"></div>
  </div>

  <div class="card full">
    <h2><span class="dot"></span>实时行为日志</h2>
    <div class="log-container" id="log-container"></div>
  </div>

  <div class="card full">
    <h2><span class="dot"></span>每日总结</h2>
    <div id="day-summaries"></div>
  </div>

  <div class="card full">
    <h2><span class="dot"></span>历史回放</h2>
    <div class="replay-controls">
      <label>起始日: <input type="number" id="replay-start" value="1" min="1"></label>
      <label>结束日: <input type="number" id="replay-end" value="5" min="1"></label>
      <button onclick="loadReplay()">加载回放</button>
      <button onclick="playReplay()" id="play-btn" disabled>播放</button>
      <button onclick="pauseReplay()" id="pause-btn" disabled>暂停</button>
    </div>
    <div id="replay-content"></div>
  </div>
</div>

<script>
let ws, currentState = {}, daySummaries = [], logs = [], replayData = null, replayInterval = null;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    document.getElementById('ws-status').textContent = '✅ 已连接';
    document.getElementById('ws-status').classList.add('connected');
  };
  ws.onclose = () => {
    document.getElementById('ws-status').textContent = '❌ 已断开，重连中...';
    document.getElementById('ws-status').classList.remove('connected');
    setTimeout(connect, 2000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') updateState(msg.data);
    if (msg.type === 'day_summary') { 
      daySummaries.push(msg.data); 
      if (daySummaries.length > 30) daySummaries.shift();
      render(); 
    }
    if (msg.type === 'event') { 
      logs.unshift(msg.data); 
      if(logs.length>100) logs.pop(); 
      render(); 
    }
  };
}

function updateState(data) {
  currentState = data;
  document.getElementById('tick').textContent = data.tick;
  document.getElementById('weather').textContent = data.weather_name || getWeatherCn(data.weather);
  document.getElementById('day').textContent = Math.floor(data.tick / 24) + 1;
  document.getElementById('knowledge').textContent = data.knowledge?.total_claims || 0;
}

function getWeatherCn(weather) {
  const map = {clear: '晴朗', rain: '下雨', snow: '下雪', wind: '大风', fog: '大雾', cloudy: '多云'};
  return map[weather] || weather;
}

function render() { renderMap(); renderAgents(); renderLogs(); renderDays(); }

async function loadReplay() {
  const start = parseInt(document.getElementById('replay-start').value);
  const end = parseInt(document.getElementById('replay-end').value);
  const response = await fetch(`/api/replay?start_day=${start}&end_day=${end}`);
  replayData = await response.json();
  document.getElementById('play-btn').disabled = false;
  document.getElementById('replay-content').innerHTML = `<div style="color:var(--green)">已加载 ${start} 到 ${end} 天的回放数据</div>`;
}

function playReplay() {
  if (!replayData || !replayData.days) return;
  let currentIndex = 0;
  document.getElementById('pause-btn').disabled = false;
  document.getElementById('play-btn').disabled = true;
  replayInterval = setInterval(() => {
    if (currentIndex >= replayData.days.length) {
      pauseReplay();
      return;
    }
    const day = replayData.days[currentIndex];
    const content = document.getElementById('replay-content');
    content.innerHTML = `
      <div class="day-card">
        <h3>📅 第 ${day.summary?.day || currentIndex + 1} 天回放</h3>
        <div class="overall-summary">${day.summary?.overall_summary || '无摘要数据'}</div>
        <div class="stats-row">
          <span>事件数量: ${day.events?.length || 0}</span>
          <span>Agent日志数量: ${day.agent_logs?.length || 0}</span>
        </div>
      </div>
    `;
    currentIndex++;
  }, 2000);
}

function pauseReplay() {
  if (replayInterval) {
    clearInterval(replayInterval);
    replayInterval = null;
  }
  document.getElementById('pause-btn').disabled = true;
  document.getElementById('play-btn').disabled = false;
}

function renderMap() {
  if (!currentState.agents) return;
  const map = document.getElementById('map');
  map.querySelectorAll('.agent-marker').forEach(e => e.remove());
  const pos = { 
    square: {x:50,y:50}, 
    workshop: {x:22,y:28}, 
    wilderness: {x:78,y:72},
    school: {x:22,y:72},
    mine: {x:78,y:28}
  };
  const clsMap = { 
    agent_elder:'elder', agent_blacksmith:'blacksmith', agent_carpenter:'carpenter',
    agent_forager:'forager', agent_scout:'scout', agent_merchant:'merchant', 
    agent_teacher:'teacher', agent_farmer:'farmer', agent_storyteller:'storyteller', 
    agent_healer:'healer', agent_miner:'miner', agent_player:'player' 
  };
  const emojiMap = {
    agent_elder:'👵', agent_blacksmith:'🔨', agent_carpenter:'🪵',
    agent_forager:'🌿', agent_scout:'🧭', agent_merchant:'💰', 
    agent_teacher:'📖', agent_farmer:'🌾', agent_storyteller:'📜', 
    agent_healer:'💊', agent_miner:'⛏️', agent_player:'👤'
  };
  currentState.agents.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'agent-marker ' + (clsMap[a.id] || '');
    const p = pos[a.location] || {x:50,y:50};
    const off = (i % 4) * 12 - 18;
    d.style.left = (p.x + off) + '%';
    d.style.top = (p.y + Math.floor(i/4) * 10) + '%';
    d.textContent = emojiMap[a.id] || '👤';
    d.title = `${a.name} | 体力:${a.energy} | ${getMoodEmoji(a.mood)}${getMoodCn(a.mood)} | ${a.location_cn} | 金币:${a.gold}`;
    map.appendChild(d);
  });
}

function getMoodEmoji(mood) {
  const map = {happy:'😊', neutral:'😐', anxious:'😰', angry:'😠', sad:'😢'};
  return map[mood] || '❓';
}

function getMoodCn(mood) {
  const map = {happy:'心情愉快', neutral:'心情平静', anxious:'有些焦虑', angry:'非常生气', sad:'心情低落'};
  return map[mood] || '心情未知';
}

function renderAgents() {
  if (!currentState.agents) return;
  const g = document.getElementById('agent-grid');
  g.innerHTML = currentState.agents.map(a => {
    const ec = a.energy > 60 ? 'energy-high' : a.energy > 30 ? 'energy-mid' : 'energy-low';
    return `<div class="agent-card">
      <div class="name"><span class="role-dot" style="background:var(--${a.role==='elder'?'purple':a.role==='blacksmith'?'orange':a.role==='forager'?'green':'blue'})"></span>${a.role_cn} ${a.name}</div>
      <div class="stats">
        <span>${getMoodEmoji(a.mood)} ${getMoodCn(a.mood)}</span>
        <span>💰 ${a.gold}</span>
        <span>📍 ${a.location_cn}</span>
      </div>
      <div class="energy-bar"><div class="fill ${ec}" style="width:${a.energy}%"></div></div>
    </div>`;
  }).join('');
}

function renderLogs() {
  const c = document.getElementById('log-container');
  c.innerHTML = logs.slice(0, 50).map(l => `<div class="log-entry"><span class="tick">T${l.tick||''}</span><span class="text">${l.action||l.type||''}</span></div>`).join('');
}

function renderDays() {
  const d = document.getElementById('day-summaries');
  d.innerHTML = daySummaries.slice().reverse().map(s => `
    <div class="day-card">
      <h3>📅 第 ${s.day} 天总结</h3>
      <div class="overall-summary">${s.overall_summary}</div>
      <div class="stats-row">
        <span>🌤️ 天气: ${getWeatherCn(s.weather)}</span>
        <span>📚 知识增长: +${s.stats.knowledge_change}</span>
        <span>💰 总金币变化: ${s.stats.gold_change >= 0 ? '+' + s.stats.gold_change : s.stats.gold_change}</span>
        <span>😊 开心人数: ${s.stats.happy_count}/12</span>
      </div>
      <div class="agent-list">
        ${s.agents.map(a => `
          <div class="agent-item">
            <b>${getRoleEmoji(a.role)} ${a.role_cn} ${a.name}</b>
            📍 ${a.location_cn} · 体力 ${a.energy}${a.energy_change >= 0 ? '+' + a.energy_change : a.energy_change} · 金币 ${a.gold}${a.gold_change >= 0 ? '+' + a.gold_change : a.gold_change}<br>
            ${a.mood_desc}，今日行为：${a.behavior_summary}
          </div>
        `).join('')}
      </div>
    </div>`).join('');
}

function getRoleEmoji(role) {
  const map = {
    elder:'👵', blacksmith:'🔨', carpenter:'🪵',
    forager:'🌿', scout:'🧭', merchant:'💰', 
    teacher:'📖', farmer:'🌾', storyteller:'📜', 
    healer:'💊', miner:'⛏️', player:'👤'
  };
  return map[role] || '👤';
}

// 初始化连接
connect();
// 定时刷新状态
setInterval(() => {
  fetch('/api/state').then(r => r.json()).then(d => { updateState(d); render(); });
}, 2000);
</script>
</body>
</html>
