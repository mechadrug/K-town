<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-town 边境小镇</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="navbar-brand">
      <div class="logo">🏘️</div>
      <h1>K-town 边境小镇</h1>
    </div>
    <div class="navbar-stats">
      <div class="stat-badge day"><span class="value" id="stat-day">第1天</span></div>
      <div class="stat-badge"><span class="value" id="stat-weather">☀️ 晴朗</span></div>
      <div class="stat-badge"><span class="value" id="stat-time">☀️ 白天</span></div>
      <div class="stat-badge gold"><span class="value" id="stat-gold">10</span></div>
      <div class="stat-badge energy"><span class="value" id="stat-energy">100</span></div>
      <div class="stat-badge"><span class="value" id="stat-location">广场</span></div>
    </div>
  </nav>

  <!-- 时间进度条 -->
  <div id="time-indicator"></div>

  <!-- 主布局 -->
  <div class="main-layout">
    <!-- 左侧：地图 + 日志 -->
    <div class="map-section">
      <!-- 地图 -->
      <div class="map-container">
        <div class="map-header">
          <h2>🗺️ 小镇地图</h2>
          <span style="font-size:0.8em;color:var(--text-secondary)">点击地点查看详情</span>
        </div>
        <div class="map-canvas" id="map-canvas">
          <svg class="map-connections" width="100%" height="100%">
            <line x1="50%" y1="30%" x2="20%" y2="25%"/>
            <line x1="50%" y1="30%" x2="80%" y2="25%"/>
            <line x1="50%" y1="30%" x2="22%" y2="70%"/>
            <line x1="50%" y1="30%" x2="80%" y2="70%"/>
            <line x1="20%" y1="25%" x2="22%" y2="70%"/>
            <line x1="80%" y1="25%" x2="80%" y2="70%"/>
          </svg>
        </div>
      </div>

      <!-- 日志区域 -->
      <div class="log-container">
        <div class="log-header">
          <h2>📋 小镇动态</h2>
          <div class="log-tabs">
            <button class="log-tab active" data-tab="log">事件</button>
            <button class="log-tab" data-tab="agents">居民</button>
            <button class="log-tab" data-tab="knowledge">知识</button>
            <button class="log-tab" data-tab="quests">任务</button>
          </div>
        </div>

        <!-- 事件日志 -->
        <div class="tab-content active" id="tab-log">
          <div class="log-content" id="log-content">
            <div class="log-entry"><span class="log-time">--:--</span><span class="log-icon">🏘️</span><span class="log-text">欢迎来到K-town边境小镇！</span></div>
          </div>
        </div>

        <!-- 居民列表 -->
        <div class="tab-content" id="tab-agents">
          <div class="agent-list" id="agent-list"></div>
        </div>

        <!-- 知识列表 -->
        <div class="tab-content" id="tab-knowledge">
          <div class="knowledge-list" id="knowledge-list"></div>
        </div>

        <!-- 任务列表 -->
        <div class="tab-content" id="tab-quests">
          <div class="quest-list" id="quest-list"></div>
        </div>
      </div>
    </div>

    <!-- 右侧：玩家面板 + 操作 -->
    <div class="sidebar">
      <!-- 玩家卡片 -->
      <div class="panel">
        <div class="player-card">
          <div class="player-avatar">👤</div>
          <div class="player-info">
            <h3>旅行者</h3>
            <div class="player-role">小镇新居民</div>
          </div>
        </div>
        <div class="player-stats">
          <div class="player-stat">
            <span>⚡ 体力</span>
            <div class="bar"><div class="bar-fill energy" id="player-energy-bar" style="width:100%"></div></div>
          </div>
          <div class="player-stat">
            <span>💰 金币</span>
            <div class="bar"><div class="bar-fill gold" id="player-gold-bar" style="width:2%"></div></div>
          </div>
        </div>
      </div>

      <!-- 操作面板 -->
      <div class="panel">
        <div class="panel-header">🎮 行动</div>
        <div class="action-grid">
          <button class="action-btn" onclick="movePlayer('square')">🏛️ 去广场</button>
          <button class="action-btn" onclick="movePlayer('workshop')">🔨 去工坊</button>
          <button class="action-btn" onclick="movePlayer('wilderness')">🌲 去荒野</button>
          <button class="action-btn" onclick="movePlayer('school')">🏫 去学校</button>
          <button class="action-btn" onclick="movePlayer('mine')">⛏️ 去矿洞</button>
          <button class="action-btn" onclick="doWork('work')">⚒️ 工作</button>
          <button class="action-btn" onclick="talkToAgent()">💬 聊天</button>
          <button class="action-btn" onclick="doRest()">💤 休息</button>
          <button class="action-btn" onclick="addKnowledge()">📖 添加知识</button>
          <button class="action-btn danger" onclick="resetSimulation()">🔄 重置模拟</button>
        </div>
      </div>

      <!-- 每日摘要 -->
      <div class="panel">
        <div class="panel-header">📰 每日摘要</div>
        <div class="panel-body" id="daily-summary">
          <p style="font-size:0.85em;color:var(--text-secondary)">等待第一天结束...</p>
        </div>
      </div>

      <!-- 游戏信息 -->
      <div class="panel">
        <div class="panel-header">ℹ️ 关于K-town</div>
        <div class="panel-body" style="font-size:0.8em;color:var(--text-secondary);line-height:1.6;">
          <p>K-town是一个由AI居民自主生活的小镇。每位居民有自己的职业、目标和记忆。</p>
          <p style="margin-top:8px;"><strong>操作提示：</strong></p>
          <p>• 点击地图地点查看详情</p>
          <p>• 添加知识影响小镇认知</p>
          <p>• 与居民聊天建立关系</p>
          <p>• 完成任务获得奖励</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 新手引导 -->
  <div class="tutorial-overlay" id="tutorial-overlay"></div>

  <script src="/static/app.js"></script>
</body>
</html>
